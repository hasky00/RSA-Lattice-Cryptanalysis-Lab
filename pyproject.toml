[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsa-lattice-cryptanalysis-lab"
version = "0.1.0"
description = "Educational Python laboratory for RSA number theory, LLL, and small-root experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Independent Research Project"}]
dependencies = ["sympy>=1.12", "fpylll>=0.6.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rsa_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
